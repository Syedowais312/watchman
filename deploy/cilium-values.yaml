# Cilium values for a local kind cluster acting as the CNI, with Hubble flow
# observability enabled. Hubble Relay is what the aggregator subscribes to.
image:
  pullPolicy: IfNotPresent
operator:
  # kind is a small cluster; a single operator replica is enough.
  replicas: 1
# kind manages node CIDRs via the Kubernetes IPAM, not Cilium's cluster-pool.
ipam:
  mode: kubernetes
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
